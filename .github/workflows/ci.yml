name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Machine quality release gate (150 retrieval + 200 prompt cases)
        run: npm run eval:release-gate
      - run: npm run build
      - run: npm audit --audit-level=high
