services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: promptgen
      POSTGRES_USER: promptgen
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - promptgen-postgres:/var/lib/postgresql/data
      - ./infra/postgres/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptgen -d promptgen"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  promptgen-postgres:
